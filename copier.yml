# Copier template for grmhay Python projects.
#
#   New project:     nix run nixpkgs#copier -- copy --trust gh:grmhay/pythonproject <dir>
#   Pull updates:    nix run nixpkgs#copier -- update --trust   (inside a project)
#
# Files under template/ split into two kinds. Tooling the rails depend on
# (noxfile, flake, CI, sandbox loop, pre-commit, DEV_RAILS.md) is managed:
# `copier update` merges template changes into it three-way, so local edits
# survive. Everything listed in _skip_if_exists is written once at generation
# and then belongs to the project.

_min_copier_version: "9.0"
_subdirectory: template
_answers_file: .copier-answers.yml

# Project-owned paths. On the first copy they are written only if absent; on
# update they are excluded from both the old and new renders, so Copier never
# touches them -- not even to recreate one the project deleted. Patterns are
# anchored with a leading "/": unanchored, "Dockerfile" would also match
# .sandcastle/Dockerfile, and update would silently drop template changes to it.
_skip_if_exists:
  - "/{{ package_name }}/**"
  - "/tests/**"
  - "/pyproject.toml"
  - "/README.md"
  - "/CONTEXT.md"
  - "/CLAUDE.md"
  - "/Dockerfile"
  - "/docs/adr/**"
  - "/noxfile_local.py"
  - "/.claude/settings.json"
  - "/flake.lock"
  - "/openapi.json"

_exclude:
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - "node_modules"
  - ".sandcastle/.env"
  - "{% if _copier_operation == 'update' %}/{{ package_name }}{% endif %}"
  - "{% if _copier_operation == 'update' %}/tests{% endif %}"
  - "{% if _copier_operation == 'update' %}/pyproject.toml{% endif %}"
  - "{% if _copier_operation == 'update' %}/README.md{% endif %}"
  - "{% if _copier_operation == 'update' %}/CONTEXT.md{% endif %}"
  - "{% if _copier_operation == 'update' %}/CLAUDE.md{% endif %}"
  - "{% if _copier_operation == 'update' %}/Dockerfile{% endif %}"
  - "{% if _copier_operation == 'update' %}/docs/adr{% endif %}"
  - "{% if _copier_operation == 'update' %}/noxfile_local.py{% endif %}"
  - "{% if _copier_operation == 'update' %}/.claude/settings.json{% endif %}"
  - "{% if _copier_operation == 'update' %}/flake.lock{% endif %}"
  - "{% if _copier_operation == 'update' %}/openapi.json{% endif %}"

project_name:
  type: str
  help: Project (distribution) name, lowercase with hyphens, e.g. dns-service
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*[a-z0-9]$')) %}
    Use lowercase letters, digits and hyphens; start with a letter.
    {% endif %}

package_name:
  type: str
  help: Python import name
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be a valid lowercase Python identifier.
    {% endif %}

type:
  type: str
  help: What kind of project is this?
  choices:
    CLI (Click): cli
    API (FastAPI + uvicorn): api
    CLI and API: both
    Library (no entry points, no container): library
  default: cli

description:
  type: str
  help: One-line description
  default: >-
    {%- if type == 'cli' -%}A Python CLI application.
    {%- elif type == 'api' -%}A Python API application.
    {%- elif type == 'both' -%}A Python application with CLI and API.
    {%- else -%}A Python library.{%- endif -%}

author_name:
  type: str
  help: Author name
  default: Graeme Hay

author_email:
  type: str
  help: Author email
  default: grmhay@gmail.com

fleet_common:
  type: bool
  help: Use homelab-fleet-common for fleet conventions (MCP transport settings)?
  default: "{{ type != 'library' }}"
  when: "{{ type != 'library' }}"

fleet_common_version:
  type: str
  help: homelab-fleet-common release tag to pin in pyproject.toml
  default: v0.1.0
  when: "{{ fleet_common }}"

default_branch:
  type: str
  help: Default git branch; CI and the deploy PR trigger on it
  default: main

github_owner:
  type: str
  help: GitHub user or organisation that owns the repository
  default: grmhay
